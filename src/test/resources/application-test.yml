spring:
  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: jdbc:h2:mem:fitback_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/callback/kakao"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

image:
  storage:
    aws-region: ap-northeast-2
    bucket: fitback-test-images
    cdn-base-url: https://example.invalid
    cloudfront-key-pair-id: test-key-pair
    cloudfront-private-key-base64: dGVzdC1wcml2YXRlLWtleQ==

jwt:
  token:
    secretKey: test-jwt-secret-key-for-test-codes
    expiration:
      access: 1800000       # 30분 (ms)
      refresh: 1209600000   # 14일 (ms)

hmac:
  secret-key: test-hmac-secret-key-for-test-codes

app:
  oauth:
    front-redirect-uri: http://localhost:3000/oauth/success
    temp-token-ttl: 180000
  password-reset:
    frontend-url: http://localhost:3000/reset-password
    sender-email: test@example.com
    token-ttl: 5m

management:
  health:
    mail:
      enabled: false
