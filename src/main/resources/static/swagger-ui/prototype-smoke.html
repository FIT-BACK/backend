<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIT-BACK P0 운영 스모크</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 920px; margin: 40px auto; padding: 0 20px; color: #17202a; }
    h1 { margin-bottom: 8px; }
    p { color: #52606d; }
    .actions { display: flex; gap: 8px; margin: 16px 0; }
    button { padding: 9px 14px; border: 0; border-radius: 6px; background: #1769aa; color: white; }
    button:disabled { background: #9aa5b1; }
    pre { min-height: 160px; overflow: auto; padding: 16px; border-radius: 8px; background: #f4f6f8; }
  </style>
</head>
<body>
  <h1>FIT-BACK P0 운영 스모크</h1>
  <p>JPEG/PNG 두 파일의 업로드 → 분석 → Shopify 추천 → 상품 상세 실시간 조회를 확인합니다.</p>
  <input id="images" type="file" accept="image/jpeg,image/png" multiple>
  <div class="actions">
    <button id="run" type="button">운영 흐름 실행</button>
    <button id="cleanup" type="button" disabled>임시 계정 정리</button>
  </div>
  <pre id="result">JPEG/PNG 파일 두 개를 선택하세요.</pre>

  <script>
    const result = document.querySelector("#result");
    const runButton = document.querySelector("#run");
    const cleanupButton = document.querySelector("#cleanup");
    let accessToken = null;

    function show(value) {
      result.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.success === false) {
        throw new Error(`${path}: ${response.status} ${body.code || ""} ${body.message || ""}`.trim());
      }
      return body.data;
    }

    function authHeaders(json = false) {
      const headers = { Authorization: `Bearer ${accessToken}` };
      if (json) headers["Content-Type"] = "application/json";
      return headers;
    }

    async function sha256(file) {
      const digest = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
      return [...new Uint8Array(digest)].map(value => value.toString(16).padStart(2, "0")).join("");
    }

    function purchaseHost(url) {
      try {
        return url ? new URL(url).host : null;
      } catch {
        return null;
      }
    }

    async function runFile(file) {
      show(`업로드 요청 중: ${file.name}`);
      const upload = await api("/api/v1/images/upload-requests", {
        method: "POST",
        headers: authHeaders(true),
        body: JSON.stringify({
          purpose: "ANALYSIS",
          contentType: file.type,
          fileSize: file.size
        })
      });

      const form = new FormData();
      Object.entries(upload.uploadFields).forEach(([key, value]) => form.append(key, value));
      form.append("file", file);
      await fetch(upload.uploadUrl, {
        method: upload.uploadMethod,
        body: form,
        mode: "no-cors"
      });

      await api(`/api/v1/images/${upload.imageId}/complete`, {
        method: "POST",
        headers: authHeaders()
      });

      show(`분석 중: ${file.name}`);
      const analysis = await api("/api/v1/analyses", {
        method: "POST",
        headers: authHeaders(true),
        body: JSON.stringify({ imageId: upload.imageId })
      });

      show(`Shopify 추천 생성 중: ${file.name}`);
      const recommendation = await api(
        `/api/v1/analyses/${analysis.reportId}/recommendations`,
        {
          method: "POST",
          headers: authHeaders(true),
          body: JSON.stringify({
            confirmedTagIds: analysis.suggestedTags.map(tag => tag.tagId),
            customTagNames: [],
            matchPercentage: analysis.matchPercentage
          })
        }
      );

      const items = recommendation.recommendationGroups.flatMap(group => group.items);
      const liveFieldCount = items.filter(item =>
        item.name &&
        item.imageUrl &&
        item.purchaseUrl &&
        item.price?.amount != null &&
        item.price?.currency
      ).length;

      let detail = null;
      if (items.length > 0) {
        const product = await api(`/api/v1/products/${items[0].productId}`, {
          headers: authHeaders()
        });
        detail = {
          productId: product.productId,
          name: product.name,
          price: product.price,
          imagePresent: Boolean(product.imageUrl),
          purchaseHost: purchaseHost(product.purchaseUrl),
          dataStatus: product.dataStatus
        };
      }

      return {
        file: {
          name: file.name,
          contentType: file.type,
          size: file.size,
          sha256: await sha256(file)
        },
        uploadCompleted: true,
        reportId: analysis.reportId,
        tags: analysis.suggestedTags.map(tag => tag.name),
        matchPercentage: analysis.matchPercentage,
        recommendation: {
          status: recommendation.recommendationStatus,
          partial: recommendation.partial,
          warnings: recommendation.warnings,
          itemCount: items.length,
          itemsWithAllLiveFields: liveFieldCount,
          categoriesWithItems: recommendation.recommendationGroups
            .filter(group => group.items.length > 0)
            .map(group => `${group.category}:${group.items.length}`)
        },
        lookupCatalogDetail: detail
      };
    }

    runButton.addEventListener("click", async () => {
      const files = [...document.querySelector("#images").files];
      if (
        files.length !== 2 ||
        !files.some(file => file.type === "image/jpeg") ||
        !files.some(file => file.type === "image/png")
      ) {
        show("JPEG 1개와 PNG 1개를 선택해야 합니다.");
        return;
      }

      runButton.disabled = true;
      try {
        const nonce = `${Date.now()}-${Math.random().toString(16).slice(2, 10)}`;
        const auth = await api("/api/v1/auth/sign", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: `p0-smoke-${nonce}@fitback.test`,
            password: `Smoke!${nonce}`
          })
        });
        accessToken = auth.accessToken;
        cleanupButton.disabled = false;

        const summaries = [];
        for (const file of files) {
          summaries.push(await runFile(file));
          show(summaries);
        }
      } catch (error) {
        show(`FAILED\n${error.message}`);
      } finally {
        runButton.disabled = false;
      }
    });

    cleanupButton.addEventListener("click", async () => {
      cleanupButton.disabled = true;
      try {
        await api("/api/v1/members/me", {
          method: "DELETE",
          headers: authHeaders()
        });
        accessToken = null;
        show(`${result.textContent}\n\n임시 계정 정리 완료`);
      } catch (error) {
        cleanupButton.disabled = false;
        show(`${result.textContent}\n\n임시 계정 정리 실패: ${error.message}`);
      }
    });
  </script>
</body>
</html>
