spring.application.name=FITBACK-Backend

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

fitback.storage.upload-directory=${FITBACK_UPLOAD_DIR:uploads}
fitback.ai.tag-analyzer=${FITBACK_AI_TAG_ANALYZER:unavailable}
fitback.ai.request-timeout=${FITBACK_AI_REQUEST_TIMEOUT:PT30S}
fitback.ai.openai.api-key=${FITBACK_AI_OPENAI_API_KEY:}
fitback.ai.openai.model=${FITBACK_AI_OPENAI_MODEL:}
fitback.ai.bedrock.region=${AWS_REGION:}
fitback.ai.bedrock.model-id=${FITBACK_AI_BEDROCK_MODEL_ID:}

image.storage.api-call-timeout=${IMAGE_S3_API_CALL_TIMEOUT:PT5S}
image.storage.api-call-attempt-timeout=${IMAGE_S3_API_CALL_ATTEMPT_TIMEOUT:PT2S}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

shopping.provider=${SHOPPING_PROVIDER:fixture}
shopping.shopify.enabled=${SHOPIFY_ENABLED:false}
shopping.shopify.endpoint=${SHOPIFY_GLOBAL_CATALOG_ENDPOINT:https://catalog.shopify.com/api/ucp/mcp}
shopping.shopify.agent-profile=${SHOPIFY_AGENT_PROFILE_URL:https://shopify.dev/ucp/agent-profiles/2026-04-08/valid-with-capabilities.json}
shopping.shopify.connect-timeout=${SHOPIFY_CONNECT_TIMEOUT:PT3S}
shopping.shopify.read-timeout=${SHOPIFY_READ_TIMEOUT:PT10S}
shopping.shopify.snapshot-ttl=${SHOPIFY_SNAPSHOT_TTL:PT15M}
shopping.shopify.address-country=${SHOPIFY_ADDRESS_COUNTRY:KR}
shopping.shopify.language=${SHOPIFY_LANGUAGE:ko}
shopping.shopify.currency=${SHOPIFY_CURRENCY:KRW}
shopping.candidate-token.ttl=${SHOPPING_CANDIDATE_TOKEN_TTL:PT10M}
