spring:
  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_EMAIL}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_REST_API_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/callback/kakao"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: 1800000       # 30분 (ms)
      refresh: 1209600000   # 14일 (ms)

image:
  storage:
    aws-region: ${AWS_REGION}
    bucket: ${IMAGE_BUCKET}
    cdn-base-url: ${IMAGE_CDN_BASE_URL}
    cloudfront-key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID}
    cloudfront-private-key-base64: ${CLOUDFRONT_PRIVATE_KEY_BASE64}

hmac:
  secret-key: ${HMAC_SECRET_KEY}

app:
  oauth:
    front-redirect-uri: ${FRONT_REDIRECT_URI}
    temp-token-ttl: 180000
  password-reset:
    frontend-url: ${FRONT_PASSWORD_RESET_URL}
    sender-email: ${MAIL_EMAIL}
    token-ttl: 5m
