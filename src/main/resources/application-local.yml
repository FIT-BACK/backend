spring:
  config:
    import: optional:file:.env[.properties]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_EMAIL}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  datasource:
    url: ${DB_URL:${LOCAL_DB_URL:jdbc:mysql://localhost:3306/fitback?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}}
    username: ${DB_USER:${LOCAL_DB_USERNAME:root}}
    password: ${DB_PASSWORD:${LOCAL_DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${LOCAL_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_REST_API_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/callback/kakao"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    org.hibernate.SQL: debug

image:
  storage:
    aws-region: ${AWS_REGION:ap-northeast-2}
    bucket: ${IMAGE_BUCKET:fitback-local-images}
    cdn-base-url: ${IMAGE_CDN_BASE_URL:https://example.invalid}
    cloudfront-key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID:local-key-pair}
    cloudfront-private-key-base64: ${CLOUDFRONT_PRIVATE_KEY_BASE64:bG9jYWwtcHJpdmF0ZS1rZXk=}

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: 1800000       # 30분 (ms)
      refresh: 1209600000   # 14일 (ms)

hmac:
  secret-key: ${HMAC_SECRET_KEY}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
  oauth:
    front-redirect-uri: ${FRONT_REDIRECT_URI:http://localhost:3000/oauth/success}
    temp-token-ttl: 180000
  password-reset:
    frontend-url: ${FRONT_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    sender-email: ${MAIL_EMAIL}
    token-ttl: 5m
    request-cooldown: 1m
  login-attempt:
    max-failures: 5
    failure-reset-duration: 1m
    lock-duration: 1m
    retention-duration: 24h
    cleanup-interval: 1h
